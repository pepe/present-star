# What the lecturer's door is limited by, defined once for every server
# that opens it: decks.pospisil.work, and decks.pan.earth while that old
# address still answers. nginx refuses a map or a zone defined twice, so
# it lives here, not in either server's file.
#
# Sign-ins, limited. The sentry takes a POST to any path it does not route
# as a sign-in, so only the three paths anybody posts to are let through:
# `/`, where the password is given, `/go`, the lecturer's moves, and `/note`,
# the lecturer's notes. Each kind has a limit of its own, per client -- a
# handful of passwords a minute, and moves and notes together as fast as a
# clicker, which is also the most anybody can guess at `/go` or `/note`
# while the sentry holds the door.
map "$request_method:$uri" $present_star_post_refused {
    default       0;
    "~^POST:"     1;
    "POST:/"      0;
    "POST:/go"    0;
    "POST:/note"  0;
}
map "$request_method:$uri" $present_star_signin {
    default       "";
    "POST:/"      $binary_remote_addr;
}
map "$request_method:$uri" $present_star_moves {
    default       "";
    "POST:/go"    $binary_remote_addr;
    "POST:/note"  $binary_remote_addr;
}
limit_req_zone $present_star_signin zone=present_star_signin:1m rate=6r/m;
limit_req_zone $present_star_moves zone=present_star_moves:1m rate=2r/s;

# Whether a request to an old address is Datastar's own -- a page already
# open there, its live stream or an action -- rather than somebody arriving.
# Datastar asks with fetch, which follows a redirect itself and never moves
# the page, so those are answered where they are; everything else is sent
# to the new address.
map "$http_datastar_request$arg_datastar" $present_star_arriving {
    ""            1;
    default       0;
}
