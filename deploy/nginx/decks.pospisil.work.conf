# The lecturer's door: presenter, held by presenter/sentry until the
# password is given. Plain HTTP on purpose -- `certbot --nginx` adds the
# certificate, the 443 listener and the redirect.
#
# The page's live stream stays open for as long as the lecture, so it is
# neither buffered nor timed out, and the upstream connection is kept.
# What it is limited by is in 00-present-star-limits.conf.

server {
    listen 80;
    listen [::]:80;
    server_name decks.pospisil.work;

    client_max_body_size 16k;

    if ($present_star_post_refused) {
        return 405;
    }
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        limit_req zone=present_star_signin burst=5 nodelay;
        limit_req zone=present_star_moves burst=20 nodelay;
        proxy_pass http://unix:/srv/run/present-star/http/presenter.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 4h;
    }
}
