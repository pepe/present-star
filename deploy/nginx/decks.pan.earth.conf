# The lecturer's door: presenter, held by presenter/sentry until the
# password is given. Plain HTTP on purpose -- `certbot --nginx` adds the
# certificate, the 443 listener and the redirect.
#
# The page's live stream stays open for as long as the lecture, so it is
# neither buffered nor timed out, and the upstream connection is kept.
# Sign-ins, limited. The sentry takes a POST to any path it does not route
# as a sign-in, so only the two paths anybody posts to are let through: `/`,
# where the password is given, and `/go`, the lecturer's moves. Each has a
# limit of its own, per client -- a handful of passwords a minute, and moves
# as fast as a clicker, which is also the most anybody can guess at `/go`
# while the sentry holds the door.
map "$request_method:$uri" $present_star_post_refused {
    default     0;
    "~^POST:"   1;
    "POST:/"    0;
    "POST:/go"  0;
}
map "$request_method:$uri" $present_star_signin {
    default     "";
    "POST:/"    $binary_remote_addr;
}
map "$request_method:$uri" $present_star_moves {
    default     "";
    "POST:/go"  $binary_remote_addr;
}
limit_req_zone $present_star_signin zone=present_star_signin:1m rate=6r/m;
limit_req_zone $present_star_moves zone=present_star_moves:1m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name decks.pan.earth;

    client_max_body_size 16k;

    if ($present_star_post_refused) {
        return 405;
    }
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        limit_req zone=present_star_signin burst=5 nodelay;
        limit_req zone=present_star_moves burst=20 nodelay;
        proxy_pass http://[::1]:7880;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 4h;
    }
}
