# The lecturer's door's old address, kept since present-star moved to
# decks.pospisil.work (2026-11): anybody arriving is sent there, with the
# path and the method kept (308); what Datastar asks of a page already open
# here -- its live stream, its moves -- is still answered here, under the
# same limits, so a lecture that is on is not cut. The certificate is the
# one certbot gave this name, and it is renewed as long as the name points
# here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name decks.pan.earth;
    ssl_certificate /etc/letsencrypt/live/decks.pan.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decks.pan.earth/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;

    if ($present_star_post_refused) {
        return 405;
    }
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        if ($present_star_arriving) {
            return 308 https://decks.pospisil.work$request_uri;
        }
        limit_req zone=present_star_signin burst=5 nodelay;
        limit_req zone=present_star_moves burst=20 nodelay;
        proxy_pass http://unix:/srv/run/present-star/http/presenter.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 4h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name decks.pan.earth;
    return 308 https://decks.pospisil.work$request_uri;
}
