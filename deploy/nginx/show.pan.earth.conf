# The students' page: watcher, the short address, open to everyone. Plain
# HTTP on purpose -- `certbot --nginx` adds the certificate, the 443
# listener and the redirect.
#
# Every student holds one live stream for the whole lecture, so it is
# neither buffered nor timed out, and the upstream connection is kept.
server {
    listen 80;
    listen [::]:80;
    server_name show.pan.earth;

    client_max_body_size 1k;

    location / {
        proxy_pass http://[::1]:7881;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 4h;
    }
}
