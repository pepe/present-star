# The students' page's old address, kept since present-star moved to
# show.pospisil.work (2026-11), because its links are out there -- in
# slides, in mails, on phones. Anybody arriving is sent to the same path
# there (308); what Datastar asks of a page already open here -- the live
# stream a student holds for the whole lecture -- is still answered here.
# The certificate is the one certbot gave this name, and it is renewed as
# long as the name points here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name show.pan.earth;
    ssl_certificate /etc/letsencrypt/live/show.pan.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/show.pan.earth/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1k;

    location / {
        if ($present_star_arriving) {
            return 308 https://show.pospisil.work$request_uri;
        }
        proxy_pass http://unix:/srv/run/present-star/http/watcher.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 4h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name show.pan.earth;
    return 308 https://show.pospisil.work$request_uri;
}
