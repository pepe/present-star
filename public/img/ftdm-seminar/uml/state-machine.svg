<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<rect width="1100" height="600" fill="white"/>
<defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#183442" stroke-width="1.5"/></marker><marker id="filled" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#183442"/></marker></defs>
<text x="550" y="40" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#183442">Lifecycle of one Enrollment</text>
<circle cx="75" cy="170" r="12" fill="#183442" stroke="#183442" stroke-width="2"/>
<line x1="87" y1="170" x2="220" y2="170" stroke="#183442" stroke-width="2" marker-end="url(#open)"/>
